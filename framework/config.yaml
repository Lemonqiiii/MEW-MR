# Medical Review Framework — Project Configuration
# ===============================================
# Edit this file for your specific review project.
# See config.example.yaml for all available options.

project:
  topic: "Your Review Topic Here"
  domain: "your research domain keywords"
  review_type: "narrative"          # narrative | systematic | meta-analysis
  target_journal: "Target Journal Name"
  language: "en"

# ── Systematic Review Settings (active when review_type is "systematic" or "meta-analysis") ──
systematic_review:
  protocol_registration: ""         # PROSPERO ID (e.g. CRD4202XXXXXXXX)
  dual_screening: true              # Two independent reviewers
  rob_tool: "RoB2"                  # RoB2 | ROBINS-I | NOS | mixed
  meta_analysis: false              # Plan to pool statistically?
  grade_assessment: true            # Generate GRADE SoF tables
  prisma_checklist: false           # Set true only for systematic/meta-analysis mode

paths:
  manuscript_src: "manuscript/submission.md"
  figures_dir: "manuscript/figures"
  data_dir: "data"
  papers_dir: "docs/papers"
  search_results_dir: "docs/search-results"
  output_dir: "manuscript"

agents:
  screening:
    paper_type_system: "default-a-j"
    exclusion_keywords:
      population: []
      intervention: []
      other: []
    type_thresholds:
      mechanism_types_min_pct: 20
      bioinformatics_max_pct: 50
      secondary_source_max_pct: 30
      abstract_only_max_pct: 20

  submission:
    target_journal_profile: ""      # Set a journal profile, e.g. "nutrients"

# ── Domain-specific fulltext screening (leave empty to skip) ──
# Add keywords for your research domain to enable Dimensions 1, 2, and 5.
# Example for NSCLC immunotherapy resistance:
#   screening:
#     mechanism_categories:
#       tumor_intrinsic:
#         label: "Tumor-Intrinsic Resistance"
#         keywords: ["oncogenic.signaling|MAPK|PI3K", ...]
#     domain_keywords: ["squam", "LUSC", "LSCC"]
#     domain_context_keywords: ["lung", "NSCLC", "pulmonary"]
#     domain_ici_focus: true
screening:
  mechanism_categories: {}
  domain_keywords: []
  domain_context_keywords: []
  domain_ici_focus: false

scripts:
  gen_word:
    output_filename: "manuscript/output.docx"
    font: "Times New Roman"
    font_size: 12
    line_spacing: 2.0
    margin_top_cm: 2.54
    margin_bottom_cm: 2.54
    margin_left_cm: 3.18
    margin_right_cm: 3.18

  audit:
    checks:
      - title_exists
      - abstract_exists
      - references_exist
      - sections_sequential
      - citation_integrity

# ── Quality checks ──
quality:
  contamination_check:
    enabled: false
    keywords: []
    lung_context_keywords: ["lung", "pulmonary"]
